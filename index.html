.th span{font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
[dir=ltr] .nm{left:0;right:auto;text-align:left;border-left:0;border-right:1px solid var(--line)}
[dir=ltr] .tcard,[dir=ltr] .letter{text-align:left}
[dir=ltr] .hb span{float:right}
.msg{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 18px 14px;margin:0 0 16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.msg .q1{position:absolute;top:-2px;inset-inline-start:14px;font-size:44px;line-height:1;color:var(--acc);opacity:.7}
.msg p{margin:16px 0 12px;font-size:16px;line-height:1.9;font-weight:700;color:var(--ink)}
.msg .chip{font-size:12px;padding:5px 12px}
.brand{display:flex;align-items:center;gap:8px}
.brand img{border-radius:8px;flex:none}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:max-content;max-width:90%;text-align:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);padding:12px 18px;border-radius:16px;font-weight:700;font-size:14px;line-height:1.7;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;background:radial-gradient(130% 55% at 50% -8%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 65%),var(--bg);background-attachment:fixed;color:var(--ink);padding:14px 12px 160px}
button{font-family:inherit;color:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:26px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.quote{margin:6px 0 0;color:var(--soft);font-size:14px;line-height:1.7}
.emenu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;min-width:130px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.emenu button{display:block;width:100%;background:none;border:0;padding:10px 14px;font-size:14px;text-align:start;border-radius:10px;color:inherit}.emenu button:active{background:var(--line)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px}
.tabs{display:flex;gap:6px;margin:12px 0 8px;background:var(--chip);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:none;padding:9px 0;border-radius:11px;font-size:15px;font-weight:700;color:var(--soft)}
.tabs button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.nav button{background:var(--chip);border:0;border-radius:12px;width:40px;height:36px;font-size:20px}
.nav b{font-size:16px}
.stat{display:flex;gap:8px;margin-bottom:10px}
.stat div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-size:12px;color:var(--soft)}
.stat strong{display:block;font-size:22px;color:var(--acc)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%}

<script>

document.documentElement.dataset.t=TH;
const THEMES={dawn:["فجر","#140b1f","#ffb547","#ff6b6b"],gold:["ذهبي فخم","#0a0a0a","#d4af37","#f5d77a"],neon:["طاقة","#0b0618","#b84dff","#ff3d8b"],forest:["هدوء","#07130f","#4ee0a1","#38c6d9"],ocean:["بحر","#050d1f","#4da3ff","#7c5cff"],cream:["كريمي","#fff6ec","#e8892b","#ee5a5a"],rose:["ورد","#1a0a14","#ff5c93","#ffa3c4"],crimson:["قوة","#0d0505","#ff3b3b","#ff9b3b"],sunset:["غروب","#1a0b16","#ff7e5f","#ffb36b"],aurora:["شفق","#06121a","#5ef2d4","#8a7bff"],emerald:["زمرد","#04120c","#2ee59d","#c6f24e"],lava:["بركان","#120706","#ff6a1a","#ffc21a"],midnight:["منتصف الليل","#070a14","#8fa8ff","#c4a8ff"],mono:["رمادي","#0b0b0c","#e4e4e7","#a1a1aa"],cyber:["سايبر","#03080a","#00f0ff","#00ff9d"],sand:["رمال","#16110b","#e0b36b","#c98a4a"],mint:["نعناع","#effaf4","#1fb67a","#3fd1c6"],sky:["سماء","#eef6ff","#2f80ed","#56ccf2"],lav:["لافندر","#f6f1ff","#8b5cf6","#d36bff"],pink:["وردي","#fff0f5","#ec407a","#ff8a65"],mountain:["🏔️ جبال","linear-gradient(#1a1840,#c2547a,#ffb07a)","#ffb07a","#ff6f91"],desert:["🏜️ صحراء","linear-gradient(#2a1840,#e0734a,#ffcf8a)","#ffb35c","#ff6b4a"],sea:["🌊 بحر","linear-gradient(#0f2a5a,#ff8a5c 55%,#14406e 56%,#0a2244)","#ff9a5c","#4dc3ff"],forest:["🌲 غابة","linear-gradient(#0b2a2a,#2e6f5a,#1f5a45)","#7be0a0","#d6f06a"],night:["🌌 ليلة نجوم","linear-gradient(#05061a,#1b1f4a,#3a3f7a)","#ffe27a","#8fa0ff"],snow:["❄️ ثلج","linear-gradient(#9fd3ff,#eaf6ff)","#2f80ed","#6fc3ff"],spring:["🌷 ربيع","linear-gradient(#a8e0ff,#f0fbff 60%,#7fd08a)","#2fae5f","#8be04a"]};

const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const active=(h,d)=>h.days.includes(d.getDay())&&iso(d)>=h.start;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function addM(d,n){const x=new Date(d.getFullYear(),d.getMonth()+n,1);x.setDate(Math.min(d.getDate(),dim(x.getFullYear(),x.getMonth())));return x}
function startD(){if(S.start)return new Date(S.start+"T00:00:00");const t=new Date();t.setHours(0,0,0,0);return t}
function cyc(k,v){const s=startD();
  if(v==="week")return[addDays(s,7*k),addDays(s,7*k+7)];
  if(v==="month")return[addM(s,k),addM(s,k+1)];
  return[addM(s,12*k),addM(s,12*k+12)]}
function span(a,b){const r=[];for(let d=new Date(a);d<b;d=addDays(d,1))r.push(new Date(d));return r}
function findIdx(v){const t=new Date();t.setHours(0,0,0,0);let k=0;while(k<2000&&cyc(k+1,v)[0]<=t)k++;return k}
function ycols(){const s=startD();return Array.from({length:12},(_,m)=>span(addM(s,12*idx+m),addM(s,12*idx+m+1)))}
function days(){const[a,b]=cyc(idx,view);return span(a,b)}
function oldDays(){
  if(view==="week"){const s=new Date(cur);s.setDate(s.getDate()-((s.getDay()+1)%7));
    return Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return d})}
  return Array.from({length:dim(cur.getFullYear(),cur.getMonth())},(_,i)=>new Date(cur.getFullYear(),cur.getMonth(),i+1));
}
function monthDays(y,m){return Array.from({length:dim(y,m)},(_,i)=>new Date(y,m,i+1))}
function count(h,ds){let a=0,b=0;ds.forEach(d=>{if(active(h,d)){b++;if(S.done[iso(d)+"|"+h.id])a++}});return[a,b]}
const pct=(a,b)=>b?Math.round(a/b*100):0;
function fmt(d){try{return d.toLocaleDateString(LOC[LANG]||"ar-EG",{day:"numeric",month:"short"})}catch(e){return d.getDate()+"/"+(d.getMonth()+1)}}

function streak(){
  let s=0,d=new Date();
  const full=x=>{let a=0,b=0;S.habits.forEach(h=>{if(active(h,x)){b++;if(S.done[iso(x)+"|"+h.id])a++}});return b?a===b:null};
  for(let i=0;i<400;i++){const r=full(d);if(r===true)s++;else if(r===false&&i>0)break;d.setDate(d.getDate()-1)}
  return s;
}
function dayStat(d){let a=0,b=0;S.habits.forEach(h=>{if(active(h,d)){b++;if(S.done[iso(d)+"|"+h.id])a++}});return[a,b]}
function today0(){const t=new Date();t.setHours(0,0,0,0);return t}
function ringSVG(p){const r=84,c=2*Math.PI*r;return `<svg width="190" height="190"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc2)"/></linearGradient></defs><circle cx="95" cy="95" r="${r}" fill="none" stroke="var(--chip)" stroke-width="14"/><circle cx="95" cy="95" r="${r}" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" style="transition:stroke-dashoffset .6s"/></svg>`}
function renderToday(){
  const t=today0(),[a,b]=dayStat(t),p=pct(a,b),hr=new Date().getHours();
  const g=hr<5?"سهران؟":hr<12?"صباح الخير":hr<18?"نهارك سعيد":"مساء الخير";
  $("quote").textContent=TR("{0}، {1}",S.name?TR("{0} يا {1}",TR(g),S.name):TR(g),TR(b?(p===100?"خلصت يومك. فخور بيك 🔥":"كل خطوة بتفرق"):"النهارده يوم راحة 🌿"));
  let H=`<div class="ring">${ringSVG(p)}<div class="c"><strong>${p}%</strong><span>${a} من ${b} النهارده</span></div></div><div class="badges"><div>🔥 ${streak()} يوم متتالي</div></div>${msgCard(p,t)}`;
  const list=S.habits.filter(x=>active(x,t));
  H+=list.length?list.map(x=>{const k=iso(t)+"|"+x.id,on=S.done[k];return `<button class="tcard ${on?"on":""}${on&&LT(k)?" late":""}" ${editing?"":`data-k="${k}"`}><span class="ck">${on?"✓":""}</span><span class="tx">${esc(x.name)}${x.sub?`<small>${esc(x.sub)}</small>`:""}${on&&LT(k)?`<small class="lt">صُلّيت بعد وقتها</small>`:""}</span>${del(x)}</button>`}).join(""):`<div class="empty">مفيش حاجة مجدولة النهارده، استمتع بيومك 🌿</div>`;
  H+=`<div class="sec">آخر 7 أيام</div><div class="strip">`+Array.from({length:7},(_,i)=>{const d=addDays(t,i-6),[x,y]=dayStat(d);return `<div><i style="--p:${y?pct(x,y):0}"></i>${DS[d.getDay()]}</div>`}).join("")+`</div>`;
  $("main").innerHTML=H;
}
function renderStats(){

/* translation engine: Arabic text is the key; PACK[lang] holds the translations.
   Keys with {0},{1}… are patterns. Missing keys fall back to English, then Arabic. */
let CL=null,CLg=null;
function comp(){
  if(CLg===LANG&&CL)return CL;
  const P=Object.assign({},PACK.en||{},PACK[LANG]||{}),ex=new Map(),pt=[];
  for(const k in P){
    if(/\{\d+\}/.test(k)){
      const parts=k.split(/\{(\d+)\}/),ix=[];let re="^";
      parts.forEach((p,i)=>{if(i%2===0)re+=p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");else{re+="([\\s\\S]+?)";ix.push(+p)}});
      pt.push({re:new RegExp(re+"$"),ix,v:P[k],w:k.replace(/\{\d+\}/g,"").length});
    }else ex.set(nk(k),P[k]);
  }
  pt.sort((a,b)=>b.w-a.w);
  CL={P,ex,pt};CLg=LANG;return CL;
}
function trCore(c,dp){
  const{ex,pt}=comp(),k=nk(c);
  if(ex.has(k))return ex.get(k);
  for(const p of pt){const m=c.match(p.re);if(m){const g={};p.ix.forEach((n,j)=>g[n]=sub(m[j+1],dp));return p.v.replace(/\{(\d+)\}/g,(x,n)=>g[n]==null?"":g[n])}}

  return c;
}

  $("sheet").innerHTML=h+`<div class="q">الأيام</div>${chipsD(W.days)}<div class="err" id="err"></div><button class="go" data-add="1">إضافة للجدول</button>`;
};
const _aw=addW;addW=function(){
  if(!W||!NC.includes(W.cat))return _aw();
  const D=[...W.days];if(!D.length){$("err").textContent="اختار يوم واحد على الأقل";return}
  if($("nm"))W.name=$("nm").value.trim();
  const st=iso(new Date()),id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);let h;
  if(W.cat==="wird")h={name:"ورد القرآن 📖",sub:AR(W.g)+(W.u==="s"?" سورة":W.u==="p"?" صفحة":" آية"),k:"wird",u:W.u,g:W.g};
  else if(W.cat==="azk")h={name:"الأذكار 📿",sub:{m:"الصباح",e:"المساء",b:"الصباح والمساء"}[W.c],k:"azk",c:W.c};
  else h={name:(W.name||"مذاكرة")+" 📚",sub:W.hr?AR(W.hr)+" ساعة":"",k:"study"};
  if(!S.start)S.start=st;S.habits.push({id,start:st,days:D,...h});idx=findIdx(view);save();closeW();render();
};
/* auto-tick linked habits from Quran reader / azkar */
const _mr=markRead;markRead=function(n,i){_mr(n,i);if(i===QD.ch[n-1].v.length-1){const d=dn(),t=iso(new Date());d.sr=d.sr||{};d.sr[t]=(+d.sr[t]||0)+1;save()}};
function sync(){
  const t=today0(),k0=iso(t),d=dn();let ch=0;
  S.habits.forEach(h=>{if(!h.k||!active(h,t)||S.done[k0+"|"+h.id])return;let ok=false;
    if(h.k==="wird")ok=(+((h.u==="s"?d.sr:h.u==="p"?d.rp:d.rd)||{})[k0]||0)>=h.g-(h.u==="p"?0.05:0);
    else if(h.k==="azk")ok=(h.c==="e"||azFull("m"))&&(h.c==="m"||azFull("e"));
    if(ok){S.done[k0+"|"+h.id]=1;ch=1}});
  if(ch)save();
}
/* more azkar */
Object.assign(AZ,{
  w:{t:"☀️ الاستيقاظ",i:[{x:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ",n:1}]},
  h:{t:"🏠 البيت والمسجد",i:[
    {x:"بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا",h:"عند دخول البيت",n:1},
    {x:"بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",h:"عند الخروج من البيت",n:1},
    {x:"اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ",h:"عند دخول المسجد",n:1},
    {x:"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ",h:"عند الخروج من المسجد",n:1}]},
  f:{t:"🍽️ الطعام",i:[
    {x:"بِسْمِ اللَّهِ",h:"قبل الأكل",n:1},
    {x:"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا، وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ",h:"بعد الأكل",n:1}]},
  k:{t:"🤲 الكرب",i:[
    {x:"لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ",n:1},
    {x:"اللَّهُمَّ رَحْمَتَكَ أَرْجُو فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ، لَا إِلَهَ إِلَّا أَنْتَ",n:1}]}
});
/* glue */
const _render=render;render=function(){
  sync();
  if(page==="gym"||page==="pray"){
    document.querySelectorAll("#bar button").forEach(b=>b.classList.toggle("on",b.dataset.pg===page));
    $("tabs").style.display="none";document.querySelector(".nav").style.display="none";$("stat").style.display="none";$("edit").style.display="none";$("fab").style.display="none";
    return page==="gym"?renderGym():renderPray();
  }
  _render();
};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-x]");if(!t)return;const[k,a]=t.dataset.x.split(":");
  if(k==="wu"){W.u=a;W.g=a==="s"?1:a==="p"?2:20;drawW()}
  else if(k==="wg"){W.g=+a;drawW()}
  else if(k==="wc"){W.c=a;drawW()}
  else if(k==="wh"){if($("nm"))W.name=$("nm").value;W.hr=+a;drawW()}
  else if(k==="sys"){const g=gy();g.s=a;g.d=0;GS.m=null;if(a==="home")GS.p="h";save();renderGym()}
  else if(k==="day"){gy().d=+a;GS.m=null;save();renderGym()}
  else if(k==="pl"){GS.p=a;renderGym()}
  else if(k==="mu"){GS.m=a==="all"?null:a;renderGym()}
  else if(k==="ex"){GS.e=+a;GS.u=EX[+a].e==="c"?"pl":"kg";lgr(+a)}
  else if(k==="u"){GS.u=a;lgr(GS.e)}
  else if(k==="ga"){
    const w=parseFloat($("gw").value)||0,r=parseInt($("gr").value);if(!(r>0)){toast("اكتب عدد العدّات");return}
    if(!w&&EX[GS.e].e!=="w"){toast("اكتب الوزن");return}
    const g=gy(),T=g.log[td()]=g.log[td()]||{};(T[GS.e]=T[GS.e]||[]).push({w,r,u:GS.u});
    Object.keys(g.log).sort().slice(0,-90).forEach(x=>delete g.log[x]);gsync();save();lgr(GS.e);renderGym();
  }
  else if(k==="gd"){const T=gy().log[td()];if(T&&T[GS.e]){T[GS.e].splice(+a,1);save();lgr(GS.e);renderGym()}}
  else if(k==="gc"){closeW();renderGym()}
  else if(k==="qperm"){try{DeviceOrientationEvent.requestPermission().then(s=>{if(s==="granted"){QV=0;startCompass();renderPray()}})}catch(x){}}
  else if(k==="pt"){PV.t=a;renderPray()}
  else if(k==="cm"){PV.m+=+a;if(PV.m<0){PV.m=11;PV.y--}if(PV.m>11){PV.m=0;PV.y++}renderPray()}
  else if(k==="loc"){if(!navigator.geolocation){toast("الموقع مش متاح");return}
    navigator.geolocation.getCurrentPosition(p=>{S.loc={la:p.coords.latitude,lo:p.coords.longitude,n:"موقعك الحالي"};save();renderPray();schedSoon()},()=>toast("مقدرتش أحدد الموقع، اسمح بالموقع من إعدادات الموبايل"),{timeout:15000})}
});
render();
if(!S.name||!S.name.trim())openOB();
