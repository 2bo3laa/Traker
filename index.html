.th span{font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
[dir=ltr] .nm{left:0;right:auto;text-align:left;border-left:0;border-right:1px solid var(--line)}
[dir=ltr] .tcard,[dir=ltr] .letter{text-align:left}
[dir=ltr] .hb span{float:right}
.msg{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 18px 14px;margin:0 0 16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.msg .q1{position:absolute;top:-2px;inset-inline-start:14px;font-size:44px;line-height:1;color:var(--acc);opacity:.7}
.msg p{margin:16px 0 12px;font-size:16px;line-height:1.9;font-weight:700;color:var(--ink)}
.msg .chip{font-size:12px;padding:5px 12px}
.brand{display:flex;align-items:center;gap:8px}
.brand img{border-radius:8px;flex:none}
.toast{position:fixed;top:calc(14px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)));left:50%;transform:translateX(-50%);width:max-content;max-width:90%;text-align:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);padding:12px 18px;border-radius:16px;font-weight:700;font-size:14px;line-height:1.7;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;background:radial-gradient(130% 55% at 50% -8%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 65%),var(--bg);background-attachment:fixed;color:var(--ink);padding:14px 12px 160px}
button{font-family:inherit;color:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:26px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.quote{margin:6px 0 0;color:var(--soft);font-size:14px;line-height:1.7}
.emenu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;min-width:130px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.emenu button{display:block;width:100%;background:none;border:0;padding:10px 14px;font-size:14px;text-align:start;border-radius:10px;color:inherit}.emenu button:active{background:var(--line)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px}
.tabs{display:flex;gap:6px;margin:12px 0 8px;background:var(--chip);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:none;padding:9px 0;border-radius:11px;font-size:15px;font-weight:700;color:var(--soft)}
.tabs button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.nav button{background:var(--chip);border:0;border-radius:12px;width:40px;height:36px;font-size:20px}
.nav b{font-size:16px}

  };
})();

function insertHabit(h){

  const k=hKey(h);

/* a prayer ticked after its time (or on a later day) is marked "late" and shown in a different colour */
const PRK={"الفجر":"f","الظهر":"d","العصر":"a","المغرب":"m","العشاء":"i"};

function prayEnd(p,d){
  const L=LC(),T=PT(d,L.la,L.lo),N=PT(addDays(d,1),L.la,L.lo),e={f:T.s,d:T.a,a:T.m,m:T.i,i:N.f+24};

}
function prayLate(h,ds){
  if(!PRK[h.name])return 0;
  const t=today0(),tk=iso(t),now=Date.now();

    if(h.name==="العشاء"&&ds===iso(addDays(t,-1))){const L=LC(),f=+dAt(t,PT(t,L.la,L.lo).f);return isFinite(f)&&now>f?1:0}
    return 1;
  }

}

  if(k==="wu"){W.u=a;W.g=a==="s"?1:a==="p"?2:20;drawW()}
  else if(k==="wg"){W.g=+a;drawW()}
  else if(k==="wc"){W.c=a;drawW()}
  else if(k==="wh"){if($("nm"))W.name=$("nm").value;W.hr=+a;drawW()}
  else if(k==="goal"){const g=gy();g.goal=a;applyPlan();save();renderGym()}
  else if(k==="gdays"){const g=gy();g.days=+a;applyPlan();save();renderGym()}
  else if(k==="sys"){const g=gy();g.s=a;g.d=0;GS.m=null;if(a==="home")GS.p="h";save();renderGym()}
  else if(k==="day"){gy().d=+a;GS.m=null;save();renderGym()}
  else if(k==="pl"){GS.p=a;renderGym()}
  else if(k==="mu"){GS.m=a==="all"?null:a;renderGym()}
  else if(k==="ex"){GS.e=+a;GS.u=EX[+a].e==="c"?"pl":"kg";lgr(+a)}
  else if(k==="u"){GS.u=a;lgr(GS.e)}
  else if(k==="ga"){
    const w=parseFloat($("gw").value)||0,r=parseInt($("gr").value);if(!(r>0)){toast("اكتب عدد العدّات");return}
    if(!w&&EX[GS.e].e!=="w"){toast("اكتب الوزن");return}
    const g=gy(),prevBest=hist(GS.e).best,T=g.log[td()]=g.log[td()]||{};(T[GS.e]=T[GS.e]||[]).push({w,r,u:GS.u});
    g.ld=g.d;
    Object.keys(g.log).sort().slice(0,-90).forEach(x=>delete g.log[x]);gsync();
    const ticked=wpAuto();
    save();lgr(GS.e);renderGym();
    if(GS.u==="kg"&&prevBest>0&&w>prevBest){S.cn=S.cn||{};S.cn.pr=(S.cn.pr||0)+1;save()}
    if(GS.u==="kg"&&prevBest>0&&w>prevBest)toast("🏆 رقم جديد! "+EX[GS.e].n+" "+AR(w)+" كجم"+(ticked?" • واتعلّمت في ورقتك ✓":""));
    else if(ticked)toast("اتعلّمت خطوة في ورقتك تلقائي ✓");
  }
  else if(k==="gd"){const T=gy().log[td()];if(T&&T[GS.e]){T[GS.e].splice(+a,1);save();lgr(GS.e);renderGym()}}
  else if(k==="gc"){closeW();renderGym()}
  else if(k==="qperm"){try{DeviceOrientationEvent.requestPermission().then(s=>{if(s==="granted"){QV=0;startCompass();renderPray()}})}catch(x){}}
  else if(k==="pt"){PV.t=a;renderPray()}
  else if(k==="cm"){PV.m+=+a;if(PV.m<0){PV.m=11;PV.y--}if(PV.m>11){PV.m=0;PV.y++}renderPray()}
  else if(k==="loc"){if(!navigator.geolocation){toast("الموقع مش متاح");return}
    navigator.geolocation.getCurrentPosition(p=>{S.loc={la:p.coords.latitude,lo:p.coords.longitude,n:"موقعك الحالي"};save();renderPray();schedSoon()},()=>toast("مقدرتش أحدد الموقع، اسمح بالموقع من إعدادات الموبايل"),{timeout:15000})}
});
render();
if(!S.name||!S.name.trim())openOB();
</script>

const nuS=()=>{const n=S.nu=(S.nu&&typeof S.nu==="object")?S.nu:{};n.sex=n.sex||"m";n.act=n.act||"1.375";n.goal=n.goal||"keep";n.bud=n.bud||"mid";n.meals=n.meals||3;n.fp=n.fp||{};n.sel=n.sel||{};n.eaten=n.eaten||{};n.seed=n.seed||0;return n};
function nuCalc(n){
  const w=+n.w,h=+n.h,a=+n.age;
  if(!(w>25&&w<300&&h>120&&h<230&&a>=5&&a<=100))return null;
  const bmr=10*w+6.25*h-5*a+(n.sex==="m"?5:-161),tdee=bmr*(+n.act);
  const bmi=w/((h/100)*(h/100));
  let t=n.goal==="lose"?tdee-500:n.goal==="gain"?tdee+300:tdee;
  const floor=n.sex==="m"?1500:1200;if(n.goal==="lose")t=Math.max(t,floor);
  t=Math.round(t/10)*10;
  const p=Math.round(Math.min(w*(n.goal==="lose"?2:1.8),t*.35/4)),f=Math.round(t*.25/9),c=Math.round((t-p*4-f*9)/4);
  const rate=(t-tdee)*7/7700;
  const tw=+n.tw;let weeks=null;if(tw>0&&rate!==0&&((tw<w&&rate<0)||(tw>w&&rate>0)))weeks=Math.ceil(Math.abs(tw-w)/Math.abs(rate));
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),t,p,f,c,bmi,rate,weeks};
}
function nuPool(slot,n){
  const bud=n.bud==="low"?1:n.bud==="mid"?2:3;
  const ok=m=>!m[2].some(([f])=>{const g=NU_G[f];return g&&n.fp[g]===-1});
  let L=NU_M[slot].filter(ok);
  let sub=L.filter(m=>m[1]<=bud);if(sub.length<3)sub=L.filter(m=>m[1]<=bud+1);if(sub.length<2)sub=L;
  const like=m=>m[2].reduce((a,[f])=>a+((NU_G[f]&&n.fp[NU_G[f]]===1)?1:0),0);
  sub=sub.map((m,i)=>[m,i]).sort((x,y)=>like(y[0])-like(x[0])||x[1]-y[1]).map(x=>x[0]);
  return sub;
}
function nuMeal(m,target){
  const mac=items=>items.reduce((a,[f,g])=>{const d=NU_F[f],k=g/100;return[a[0]+d[1]*k,a[1]+d[2]*k,a[2]+d[3]*k,a[3]+d[4]*k]},[0,0,0,0]);
  const base=m[2].filter(i=>!i[2]),fix=m[2].filter(i=>i[2]);
  const kb=mac(base)[0],kf=mac(fix)[0];
  let k=kb>0?(target-kf)/kb:1;k=Math.max(.5,Math.min(2.5,k));
  const items=m[2].map(([f,g,x])=>{let v=x?g:g*k;v=f==="egg"?Math.max(50,Math.round(v/50)*50):Math.max(5,Math.round(v/5)*5);return[f,v,x]});
  const t=mac(items);
  return{name:m[0],cost:m[1],items,kcal:Math.round(t[0]),p:Math.round(t[1])};
}
function nuPlan(n,c){
  const sh=n.meals===4?{b:.25,l:.35,d:.25,s:.15}:{b:.30,l:.40,d:.30};
  const out={};
  Object.keys(sh).forEach(sl=>{
    const pool=nuPool(sl,n),len=pool.length||1,base=((n.sel[sl]||0)+(n.seed||0))%len;
    out[sl]={opts:[0,1,2].filter(i=>i<len).map(i=>nuMeal(pool[(base+i)%len],c.t*sh[sl]))};
  });
  return out;
}

  <div class="q">المبلغ الشهري (جنيه)</div><input class="inp" id="mna" type="number" inputmode="decimal" value="${esc(W.a)}">
  <div class="q">يوم التجديد في الشهر (١-٢٨)</div><input class="inp" id="mnd" type="number" inputmode="numeric" min="1" max="28" value="${W.sd}">
  <div class="err" id="mnerr"></div><button class="go" data-mn="add:sub">أضف الاشتراك</button>`;
  else $("sheet").innerHTML=`<h2>ميزانية الشهر 🎯</h2><div class="q">أقصى مبلغ تصرفه في الشهر (جنيه)</div><input class="inp" id="mna" type="number" inputmode="decimal" value="${m.bud||""}"><div class="err" id="mnerr"></div><button class="go" data-mn="add:bud">احفظ</button>`;
}
function mnRead(){if($("mna"))W.a=$("mna").value;if($("mnn"))W.n=$("mnn").value;if($("mnd"))W.sd=+$("mnd").value}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-mn]");if(!t)return;e.stopPropagation();
  const[k,a]=t.dataset.mn.split(":"),m=mnS(),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  if(k==="new"){openMN(a);return}
  if(k==="x"){m.ex=m.ex.filter(x=>x.id!==a);save();render();return}
  if(k==="xs"){m.sub=m.sub.filter(x=>x.id!==a);save();render();try{schedNotif()}catch(x){}return}
  if(!W||!W.mn)return;
  mnRead();
  if(k==="c"){W.c=a;drawMN();return}
  if(k==="dy"){W.day=a;drawMN();return}
  if(k==="add"){
    const err=s=>{$("mnerr").textContent=s},v=parseFloat(W.a);
    if(a==="ex"){
      if(!(v>0))return err("اكتب المبلغ");
      m.ex.push({id:id(),a:v,c:W.c,n:(W.n||"").trim(),d:iso(W.day==="yest"?addDays(today0(),-1):today0()),t:Date.now()});
      m.ex=m.ex.slice(-1500);toast("اتسجّل ✓");
    }else if(a==="sub"){
      const nm=(W.n||"").trim(),dy=Math.round(W.sd);
      if(!nm)return err("اكتب اسم الاشتراك");if(!(v>0))return err("اكتب المبلغ");if(!(dy>=1&&dy<=28))return err("اليوم من ١ لـ ٢٨");
      m.sub.push({id:id(),n:nm,a:v,day:dy});toast("اتضاف ✓");
    }else{m.bud=v>0?v:0;toast("اتحفظت ✓")}

  }
},true);

<script>
/* ===== comeback: quit-a-habit tracker, urge tool, relapse flow, "never miss twice" ===== */
const QT_TPL=[["🚭","التدخين"],["🍬","السكر"],["📱","السوشيال ميديا"],["🌙","السهر"],["🎮","الألعاب بإفراط"],["🍟","الأكل السريع"],["🔒","عادة تانية (باسم خاص)"]];
const QT_TRG=["ملل","توتر","وحدة","تعب","سهر","مكان أو ناس","مشاعر صعبة","من غير سبب واضح"];
const QT_ALT=["🚿 توضّأ أو خد دش","🚶 امشي ١٠ دقايق","💧 اشرب كوباية مياه","📞 كلّم حد بتثق فيه","📿 اذكر الله واستغفر","✍️ اكتب اللي جواك","💪 اعمل ١٠ تمارين ضغط"];
const QT_MS=[1,3,7,14,30,60,90,180,365];
const QT_MSG=["الانتكاسة مش نهاية الطريق، دي محطة تتعلّم منها.","اللي يرجع بعد ما يقع أقوى ممن ما جرّبش.","أيامك اللي فاتت ما راحتش، هي اللي هتفرق المرة الجاية.","ارجع من جديد، فإن الله يحب التوّابين."];
const qtAll=()=>Array.isArray(S.qt)?S.qt:(S.qt=[]);
const qtDays=q=>Math.floor((Date.now()-q.since)/864e5);
const qtLen=q=>Math.max(0,Date.now()-q.since);
const qtFmt=ms=>{const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return d?`${AR(d)} يوم${h?" و"+AR(h)+" ساعة":""}`:`${AR(h)} ساعة`};
function qtInsight(q){
  const r=q.rel||[];if(r.length<2)return "";
  const cnt={};r.forEach(x=>{if(x.tag)cnt[x.tag]=(cnt[x.tag]||0)+1});
  const tg=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const hrs={};r.forEach(x=>{const h=new Date(x.at).getHours(),b=h>=22||h<4?"بالليل":h<12?"الصبح":h<18?"بعد الضهر":"المغرب";hrs[b]=(hrs[b]||0)+1});
  const hb=Object.entries(hrs).sort((a,b)=>b[1]-a[1])[0];
  return `📊 أغلب انتكاساتك بتحصل ${hb[0]}${tg?` وسببها غالبًا «${tg[0]}»`:""}. جهّز بديل مسبقًا للوقت ده.`;
}
function qtCard(q){
  const d=qtDays(q),nx=QT_MS.find(m=>m>d)||QT_MS[QT_MS.length-1],pv=[0,...QT_MS].filter(m=>m<=d).pop()||0,pc=Math.min(100,Math.round((d-pv)/(nx-pv)*100)),best=Math.max(q.best||0,qtLen(q));
  return `<div class="tcard on" style="display:block;margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1;font-size:17px">${esc(q.e)} ${esc(q.n)}</b><i data-qt="del:${q.id}" style="font-style:normal;padding:4px 8px;opacity:.7">🗑</i></div>
  <div style="font-size:42px;font-weight:800;margin:6px 0 0">${AR(d)} <small style="font-size:16px">يوم</small></div><div style="font-size:12px;opacity:.85">${qtFmt(qtLen(q))} من غير • أطول فترة: ${qtFmt(best)} • انتكاسات: ${AR((q.rel||[]).length)} • رغبات عدّت: ${AR(q.res||0)}</div>
  <div style="height:7px;border-radius:99px;background:#0003;margin:10px 0 3px;overflow:hidden"><div style="height:100%;width:${pc}%;background:var(--panel)"></div></div><div style="font-size:11px;opacity:.8">الهدف الجاي: ${AR(nx)} يوم</div>
  ${qtInsight(q)?`<div style="font-size:12px;margin-top:8px;line-height:1.7">${qtInsight(q)}</div>`:""}
  ${q.plan?`<div style="font-size:12px;margin-top:8px;line-height:1.7">📌 خطتي: ${esc(q.plan)}</div>`:""}
  <div class="chips" style="margin-top:10px"><button class="chip" data-qt="urge:${q.id}" style="background:var(--panel);color:var(--ink);font-weight:800">🆘 عندي رغبة دلوقتي</button><button class="chip" data-qt="rel:${q.id}" style="background:var(--panel);color:var(--ink)">↩️ حصلت انتكاسة</button><button class="chip" data-qt="plan:${q.id}" style="background:var(--panel);color:var(--ink)">📝 خطتي</button></div></div>`;
}
function renderQuit(){
  $("quote").textContent="السقطة مش الفشل، الفشل إنك ما ترجعش";
  const L=qtAll();
  $("main").innerHTML=`<div class="deen" style="padding-bottom:110px"><h2 style="margin:6px 2px">🌱 رحلة الإقلاع</h2>
  <div class="note" style="color:var(--soft);line-height:1.8">اختار عادة عايز تبطّلها. التطبيق بيحسب أيامك، ولو حصلت انتكاسة مش بتبدأ من الصفر المهين: بتتعلّم السبب وتحتفظ بأطول فترة وصلتلها.</div>
  <div class="chips" style="margin:10px 0"><button class="chip on" data-qt="add" style="font-size:15px;padding:10px 18px">➕ عادة جديدة للإقلاع</button></div>
  ${L.map(qtCard).join("")||'<div class="empty">لسه ما ضفتش عادة. لو حاسس إن الموضوع تقيل عليك أو بيأثر على حياتك، كلّم حد بتثق فيه أو مختص، مفيش عيب في ده.</div>'}</div>`;
}
function qtToday(){if(!uxOn("quit"))return "";
  const L=qtAll();if(!L.length)return "";
  return `<div class="sec">🌱 رحلة الإقلاع</div>`+L.map(q=>`<button class="tcard" data-pg="quit"><span class="tx">${esc(q.e)} ${esc(q.n)}<small>${AR(qtDays(q))} يوم • أطول فترة ${qtFmt(Math.max(q.best||0,qtLen(q)))}</small></span><span class="chip" data-qt="urge:${q.id}" style="background:var(--panel);color:var(--ink)">🆘</span></button>`).join("");
}
function qtBanner(){
  try{
    const t=today0(),y=addDays(t,-1),k=iso(y);
    if(S.qbd===iso(t))return "";
    const run={},miss=S.habits.filter(h=>{
      if(!active(h,y)||S.done[k+"|"+h.id])return false;
      let n=0;for(let i=2;i<30;i++){const d=addDays(t,-i);if(!active(h,d))continue;if(S.done[iso(d)+"|"+h.id])n++;else break}
      run[h.id]=n;return n>=3});
    if(!miss.length)return "";
    const h=miss[0];
    return `<div class="tcard" style="display:block;margin-bottom:10px;border-color:var(--acc)"><div style="font-weight:700">🌱 امبارح فاتتك «${esc(h.name)}» بعد ${AR(run[h.id])} يوم متتالي</div><div style="font-size:13px;opacity:.85;margin-top:4px;line-height:1.7">المرة الواحدة مش انتكاسة. القاعدة: ما تفوّتش مرتين. ارجع النهارده وكمّل سلسلتك.</div><button class="chip" data-qt="bn" style="margin-top:8px">تمام، راجع 💪</button></div>`;
  }catch(e){return ""}
}
function openQT(kind,id){W={qt:kind,id:id||null,tpl:null,name:"",tag:"",note:"",risk:"",ue:0};drawW();$("modal").classList.add("on")}
function drawQT(){
  const ch=(on,k,t)=>`<button class="chip ${on?"on":""}" data-qt="${k}">${t}</button>`,q=qtAll().find(z=>z.id===W.id);
  if(W.qt==="add"){
    $("sheet").innerHTML=`<h2>عادة للإقلاع 🌱</h2><p>اختار اسمها، وأنا هحسبلك أيامك من اللحظة دي.</p><div class="chips">${QT_TPL.map(([e,n],i)=>ch(W.tpl===i,"t:"+i,e+" "+n)).join("")}</div>
    ${W.tpl===QT_TPL.length-1?`<div class="q">اكتب اسم تختاره (محدش هيشوفه غيرك)</div><input class="inp" id="qtn" placeholder="مثال: عادة X" value="${esc(W.name)}">`:""}
    <div class="q">وقت حساس عندك (اختياري) — هنبعتلك تنبيه يفكّرك</div><input class="inp" type="time" id="qtr" value="${esc(W.risk)}">
    <div class="err" id="qterr"></div><button class="go" data-qt="save">ابدأ</button>`;
  }else if(W.qt==="urge"&&q){
    const left=W.ue?Math.max(0,W.ue-Date.now()):600000,m=Math.floor(left/60000),s=Math.floor(left/1000)%60;
    const alts=(q.alt&&q.alt.length?q.alt:QT_ALT);
    $("sheet").innerHTML=`<h2>الرغبة بتعدّي زي الموجة 🌊</h2><p>مش لازم تنفّذها. اصبر ١٠ دقايق، وهتلاقيها هديت.</p>
    <div style="text-align:center;margin:12px 0"><div id="qtT" style="font-size:54px;font-weight:800">${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}</div><div id="qtB" style="font-size:15px;opacity:.85;min-height:24px">${W.ue?"":"دوس ابدأ"}</div></div>
    ${W.ue?`<div class="chips" style="justify-content:center"><button class="chip on" data-qt="won">✅ عدّت الرغبة</button></div>`:`<button class="go" data-qt="start">▶ ابدأ العدّ</button>`}
    <div class="q">اعمل حاجة بدل ما تفكّر فيها:</div><div class="chips">${alts.map(a=>`<span class="chip">${esc(a)}</span>`).join("")}</div>
    <div class="note" style="color:var(--soft)">لو حاسس إنك في خطر على نفسك، كلّم حد قريب منك دلوقتي أو اتصل بالإسعاف 123.</div>`;
  }else if(W.qt==="rel"&&q){
    const msg=QT_MSG[(q.rel||[]).length%QT_MSG.length];
    $("sheet").innerHTML=`<h2>ولا يهمك 🤍</h2><p style="line-height:1.9">${msg}<br>اتفضل سجّل اللي حصل عشان نتعلّم منه. أيامك (${AR(qtDays(q))}) هتفضل في "أطول فترة".</p>
    <div class="q">إيه اللي سبّب الموقف؟</div><div class="chips">${QT_TRG.map(t=>ch(W.tag===t,"g:"+t,t)).join("")}</div>
    <div class="q">ملاحظة (اختياري)</div><input class="inp" id="qtnote" placeholder="إيه اللي هتعمله مختلف؟" value="${esc(W.note)}">
    <div class="err" id="qterr"></div><button class="go" data-qt="relsave">سجّل وابدأ من جديد</button>`;
  }else if(W.qt==="plan"&&q){
    $("sheet").innerHTML=`<h2>خطتي 📝</h2><p>جملة واحدة: «لو حصل ... هعمل ...»</p><input class="inp" id="qtplan" placeholder="لو حسّيت بملل بالليل هعمل ..." value="${esc(q.plan||"")}"><div class="q">وقت حساس (تنبيه يومي)</div><input class="inp" type="time" id="qtr" value="${esc(q.risk||"")}"><button class="go" data-qt="plansave">احفظ</button>`;
  }
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-qt]");if(!t)return;e.stopPropagation();
  const[k,a]=t.dataset.qt.split(":"),L=qtAll(),q=L.find(z=>z.id===a)||L.find(z=>z.id===(W&&W.id));
  const rd=()=>{if(W&&W.qt){if($("qtn"))W.name=$("qtn").value;if($("qtr"))W.risk=$("qtr").value;if($("qtnote"))W.note=$("qtnote").value}};
  if(k==="bn"){S.qbd=iso(today0());save();render();return}
  if(k==="add"){openQT("add");return}
  if(k==="urge"){openQT("urge",a);return}
  if(k==="rel"){openQT("rel",a);return}
  if(k==="plan"){openQT("plan",a);return}
  if(k==="del"){if(confirm("تمسح العادة دي وكل سجلها؟")){S.qt=L.filter(z=>z.id!==a);save();render();try{schedNotif()}catch(x){}}return}
  if(!W||!W.qt)return;
  rd();
  if(k==="t"){W.tpl=+a;drawQT();return}
  if(k==="g"){W.tag=a;drawQT();return}
  if(k==="save"){
    if(W.tpl===null)return $("qterr").textContent="اختار عادة";
    const last=W.tpl===QT_TPL.length-1,nm=last?(W.name||"").trim():QT_TPL[W.tpl][1];
    if(!nm)return $("qterr").textContent="اكتب الاسم";
    L.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),n:nm,e:QT_TPL[W.tpl][0],since:Date.now(),best:0,rel:[],res:0,risk:W.risk||"",plan:""});
    save();closeW();render();try{schedNotif()}catch(x){}toast("بالتوفيق! أول يوم النهارده 🌱");return;
  }
  if(!q)return;
  if(k==="start"){W.ue=Date.now()+600000;drawQT();return}
  if(k==="won"){q.res=(q.res||0)+1;save();closeW();render();try{buzz([30,60,30])}catch(x){}toast("🎉 عدّت! دي قوتك");return}
  if(k==="relsave"){
    const len=qtLen(q);q.best=Math.max(q.best||0,len);
    (q.rel=q.rel||[]).push({at:Date.now(),len,tag:W.tag||"",note:(W.note||"").trim().slice(0,200)});
    q.since=Date.now();
    save();closeW();render();toast("اتسجّلت. ابدأ من جديد وأطول فترة بتاعتك محفوظة 🤍");return;
  }
  if(k==="plansave"){q.plan=($("qtplan")?$("qtplan").value:"").trim().slice(0,200);q.risk=W.risk||"";save();closeW();render();try{schedNotif()}catch(x){}toast("اتحفظت ✓");return}
},true);
setInterval(()=>{
  if(!(W&&W.qt==="urge"&&W.ue))return;
  const left=Math.max(0,W.ue-Date.now()),m=Math.floor(left/60000),s=Math.floor(left/1000)%60,el=$("qtT"),b=$("qtB");
  if(el)el.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  if(b){const ph=Math.floor((Date.now()/1000)%10);b.textContent=ph<4?"🌬️ شهيق… ٤ ثواني":"😮‍💨 زفير بطيء… ٦ ثواني"}
  if(left<=0&&b)b.textContent="عدّت ١٠ دقايق 👏 لو لسه فيه رغبة، كمّل ١٠ كمان";
},1000);
try{render()}catch(e){}
</script>
<script>
/* ===== reminders for every habit ===== */

 ["شرب المياه",RM_2H],["مشي",["17:30"]],["نوم بدري",["22:30"]],["صحيان بدري",["05:00"]],["فيتامينات",["09:00"]],["تأمل",["07:30"]],["الأسنان",["23:00"]],["كارديو",["18:30"]],
 ["قراءة",["21:00"]],["لغة",["20:00"]],["مذاكرة",["19:00"]],["يوميات",["22:00"]],["بودكاست",["17:00"]],["من غير موبايل",["22:00"]],["مراجعة أهداف",["08:00"]],
 ["ترتيب السرير",["08:00"]],["ترتيب البيت",["16:00"]],["تسجيل المصاريف",["21:30"]],["صلة رحم",["19:00"]],["سقي النباتات",["08:30"]],["غسيل",["10:00"]]];

  ${W.mode==="2h"?`<div class="note" style="color:var(--soft)">١٠ص ١٢م ٢م ٤م ٦م ٨م</div>`:W.mode==="3h"?`<div class="note" style="color:var(--soft)">٩ص ١٢م ٣م ٦م ٩م</div>`:""}
  <div class="note" style="color:var(--soft)">التذكير بيجي في أيام العادة بس، ومش بيجي لو خلّصتها.</div>
  <button class="go" data-rmx="save">احفظ</button>`;

document.addEventListener("click",async e=>{

<script>

function mdActive(x,d){const k=iso(d);if(x.start&&k<x.start)return false;if(x.end&&k>x.end)return false;return !x.days||!x.days.length||x.days.indexOf(d.getDay())>=0}
function mdDoses(d){
  const m=mdS(),k=iso(d),out=[];

const mdState=z=>z.lg?(z.lg.s==="t"?"taken":"skipped"):(Date.now()>z.at+30*60000?"missed":Date.now()>=z.at-5*60000?"due":"later");
function mdTake(key,op){

function mdAdh(days){

<script>
/* ===== app lock (PIN) and automatic snapshots ===== */
const LK="hb_lock",LKF="hb_lkf",SNK="hb_snaps";
const lkGet=()=>{try{return JSON.parse(localStorage.getItem(LK)||"null")}catch(e){return null}};
function lkSimple(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
async function lkHash(pin,salt){
  try{if(window.crypto&&crypto.subtle){const d=new TextEncoder().encode(salt+":"+pin),h=await crypto.subtle.digest("SHA-256",d);return"s"+[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}}catch(e){}
  return"w"+lkSimple(salt+":"+pin);
}
const lkPad=(pre)=>`<div class="lkpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-lk="${pre}k:${n}">${AR(n)}</button>`).join("")}<button data-lk="${pre}k:del">⌫</button><button data-lk="${pre}k:0">${AR(0)}</button><button data-lk="${pre}k:ok" class="ok">✓</button></div>`;
const lkDots=(n,len)=>`<div class="lkdots">${Array.from({length:Math.max(len,n,4)},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</div>`;
let LKBUF="",LKWAIT=0;
function lkLocked(){return document.documentElement.classList.contains("locked")}
function lkShow(){
  const L=lkGet();if(!L)return;
  document.documentElement.classList.add("locked");
  let o=document.getElementById("lockscr");
  if(!o){o=document.createElement("div");o.id="lockscr";document.body.appendChild(o)}

const BIO=()=>NPL("Biometric");
let BIOAV={bio:false,dev:false};
async function bioProbe(){const P=BIO();if(!P)return BIOAV;try{const r=await P.isAvailable();BIOAV={bio:!!(r&&r.bio),dev:!!(r&&r.dev)}}catch(e){}return BIOAV}
async function bioAsk(title,dev){const P=BIO();if(!P)return false;try{const r=await P.verify({title:title||"افتح جدولي",device:!!dev,cancel:"استخدم الرقم السري"});return !!(r&&r.ok)}catch(e){return false}}
function lkUnlock(){localStorage.removeItem(LKF);LKBUF="";document.documentElement.classList.remove("locked");const o=document.getElementById("lockscr");if(o)o.remove();try{render()}catch(e){}}

  }

    return;
  }

}
async function lkTry(){
  const L=lkGet(),f=(()=>{try{return JSON.parse(localStorage.getItem(LKF)||"{}")}catch(e){return{}}})();
  if(Date.now()<(f.until||0)){LKBUF="";lkDraw();return}

}

/* set / change / disable the PIN */
function openLK(mode){W={lk:1,mode,step:mode==="set"?"new":"cur",buf:"",first:""};drawW();$("modal").classList.add("on")}
function drawLK(){
  const T={cur:"اكتب الرقم السري الحالي",new:"اكتب رقم سري جديد (٤ لـ ٦ أرقام)",confirm:"اكتبه تاني للتأكيد"};
  $("sheet").innerHTML=`<h2>🔒 ${W.mode==="off"?"إلغاء القفل":W.mode==="change"?"تغيير الرقم":"تفعيل القفل"}</h2><div style="text-align:center;margin:8px 0">${T[W.step]}${lkDots(W.buf.length,4)}<div class="lkerr" id="lkerr2">${esc(W.err||"")}</div></div>${lkPad("s")}`;
}
async function lkStep(){
  const b=W.buf,L=lkGet();
  if(W.step==="cur"){
    if(await lkHash(b,L.salt)!==L.hash){W.err="الرقم غلط";W.buf="";drawLK();return}
    if(W.mode==="off"){localStorage.removeItem(LK);closeW();render();toast("اتلغى القفل");return}
    W.step="new";W.buf="";W.err="";drawLK();return;
  }
  if(b.length<4){W.err="٤ أرقام على الأقل";drawLK();return}
  if(W.step==="new"){W.first=b;W.step="confirm";W.buf="";W.err="";drawLK();return}
  if(b!==W.first){W.err="الرقمين مش متطابقين";W.step="new";W.buf="";W.first="";drawLK();return}
  const salt=Math.random().toString(36).slice(2)+Date.now().toString(36),old=lkGet();
  localStorage.setItem(LK,JSON.stringify({mode:"pin",salt,hash:await lkHash(b,salt),len:b.length,to:old?old.to:60,bio:old&&old.bio&&old.mode!=="device"?1:0}));
  closeW();render();toast("القفل اتفعّل 🔒");
  const av=await bioProbe(),cur=lkGet();
  if(av.bio&&cur&&!cur.bio&&confirm("تفعّل فتح التطبيق بالبصمة / الوجه كمان؟ (الرقم السري هيفضل احتياطي)")){
    if(await bioAsk("تأكيد البصمة",false)){cur.bio=1;localStorage.setItem(LK,JSON.stringify(cur));render();toast("اتفعّلت البصمة 👆")}
  }
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-lk]");if(!t)return;e.stopPropagation();
  const v=t.dataset.lk;
  if(v==="forgot"){lkWipe();return}
  if(v==="ubio"){lkBio();return}
  if(v==="dev"){
    const av=await bioProbe();
    if(!av.dev){toast("فعّل بصمة أو قفل شاشة في إعدادات الموبايل الأول");return}
    if(await bioAsk("تأكيد التفعيل",true)){localStorage.setItem(LK,JSON.stringify({mode:"device",to:60}));render();toast("القفل اتفعّل بقفل الموبايل 🔒")}
    return;
  }
  if(v==="bio"){
    const L=lkGet();if(!L||L.mode==="device")return;
    if(L.bio){L.bio=0;localStorage.setItem(LK,JSON.stringify(L));render();return}
    const av=await bioProbe();if(!av.bio){toast("مفيش بصمة أو وجه متسجّل في الموبايل");return}
    if(await bioAsk("تأكيد البصمة",false)){L.bio=1;localStorage.setItem(LK,JSON.stringify(L));render();toast("اتفعّلت البصمة 👆")}
    return;
  }
  if(v==="off"){
    const L=lkGet();
    if(L&&L.mode==="device"){if(await bioAsk("تأكيد إلغاء القفل",true)){localStorage.removeItem(LK);render();toast("اتلغى القفل")}return}
    openLK("off");return;
  }
  if(v==="set"||v==="change"){openLK(v);return}
  if(v.indexOf("to:")===0){const L=lkGet();if(L){L.to=+v.slice(3);localStorage.setItem(LK,JSON.stringify(L));render()}return}
  if(v==="snap"){snTake(false);render();toast("اتاخدت نسخة 📸");return}
  if(v.indexOf("rs:")===0){
    const k=v.slice(3),js=localStorage.getItem(k);if(!js)return;
    if(confirm("هترجّع بياناتك لتاريخ النسخة دي؟ هناخد نسخة من الوضع الحالي الأول.")){snTake(false);try{restoreFrom(js);toast("اتسترجعت ✓")}catch(x){toast("النسخة تالفة")}}
    return;
  }
  if(v==="settings"){$("thm").click();return}
  const lock=v[0]==="u",sh=v[0]==="s",key=v.slice(1);
  const op=key.slice(2);
  if(lock){
    if(op==="del")LKBUF=LKBUF.slice(0,-1);else if(op==="ok"){}else if(LKBUF.length<8)LKBUF+=op;
    const L=lkGet();if(!L)return;
    if(op==="ok"||LKBUF.length>=L.len){if(LKBUF.length>=4){await lkTry();return}}
    lkDraw();return;
  }
  if(sh&&W&&W.lk){
    if(op==="del")W.buf=W.buf.slice(0,-1);else if(op==="ok"){await lkStep();return}else if(W.buf.length<6)W.buf+=op;
    W.err="";drawLK();
  }
},true);
let LKHID=0;

const snList=()=>{try{return JSON.parse(localStorage.getItem(SNK)||"[]")}catch(e){return[]}};
function snTake(auto){

  while(L.length>4){const o=L.shift();try{localStorage.removeItem(o.k)}catch(e){}}
  try{localStorage.setItem(SNK,JSON.stringify(L))}catch(e){}
}
function snAuto(){try{const L=snList(),last=L.length?L[L.length-1].at:0;if((S.habits.length||(S.tk||[]).length||(S.md&&S.md.meds&&S.md.meds.length))&&Date.now()-last>7*864e5)snTake(true)}catch(e){}}

  const L=lkGet(),sn=snList().slice().reverse();
  $("main").innerHTML=`<div class="deen" style="padding-bottom:110px"><h2 style="margin:6px 2px">🔒 الحماية والنسخ</h2>
  <div class="tcard ${L?"on":""}" style="display:block"><b>قفل التطبيق (اختياري): ${L?(L.mode==="device"?"مفعّل بقفل الموبايل ✓":"مفعّل برقم سري ✓"):"مقفول"}</b><div style="font-size:12px;opacity:.85;margin:4px 0 8px;line-height:1.7">${L?"التطبيق بيتقفل لما تخرج منه، ومحدش يشوف أدويتك أو مصاريفك أو رحلتك.":"التطبيق بيفتح من غير قفل لحد ما تفعّله. فعّله لو فيه بيانات خاصة (أدوية، مصاريف…)."}</div>
  <div class="chips">${L?`${L.mode==="device"?"":`<button class="chip" data-lk="change" style="background:var(--panel);color:var(--ink)">تغيير الرقم</button>`}<button class="chip" data-lk="off" style="background:var(--panel);color:var(--ink)">إلغاء القفل</button>`:`<button class="chip on" data-lk="dev" style="background:var(--panel);color:var(--ink);font-weight:800">👆 بالبصمة / الوجه (الأسهل)</button><button class="chip" data-lk="set" style="background:var(--panel);color:var(--ink)">🔢 رقم سري للتطبيق</button>`}</div></div>
  ${!L?`<div class="note" style="color:var(--soft);line-height:1.8">«بالبصمة / الوجه» بيستخدم قفل موبايلك نفسه (بصمة أو وجه أو نمط أو رقم الموبايل)، فمش هتحتاج تحفظ رقم جديد.${BIOAV.dev?"":"<br>⚠️ المتاح في موبايلك دلوقتي: مفيش قفل شاشة متفعّل."}</div>`:""}
  ${L&&L.mode!=="device"?`<div class="chips" style="margin-top:8px"><button class="chip ${L.bio?"on":""}" data-lk="bio">👆 فتح بالبصمة / الوجه ${L.bio?"✓":""}</button></div>${BIOAV.bio||L.bio?"":'<div class="note" style="color:var(--soft)">مفيش بصمة أو وجه متسجّل في موبايلك.</div>'}`:""}
  ${L?`<div class="q">يتقفل بعد ما تخرج بـ</div><div class="chips">${[[0,"فورًا"],[60,"دقيقة"],[300,"٥ دقايق"]].map(([s,t])=>`<button class="chip ${(L.to||0)===s?"on":""}" data-lk="to:${s}">${t}</button>`).join("")}</div>`:""}
  <div class="sec">📸 نسخ تلقائية</div>
  <div class="note" style="color:var(--soft);line-height:1.8">التطبيق بياخد نسخة من بياناتك كل أسبوع (بيحتفظ بآخر ٤). لو مسحت حاجة بالغلط أو بياناتك اتلخبطت، ارجع لنسخة قديمة.</div>
  <div class="chips" style="margin:8px 0"><button class="chip on" data-lk="snap">📸 خد نسخة دلوقتي</button><button class="chip" data-lk="settings">💾 ملف احتياطي (من الإعدادات)</button></div>
  ${sn.length?sn.map(x=>`<div class="tcard" style="display:flex"><span class="tx">${x.auto?"تلقائية":"يدوية"} • ${fmt(new Date(x.at))} ${hm(new Date(x.at).getHours()+new Date(x.at).getMinutes()/60)}<small>${AR(Math.round(x.sz/1024))} كيلو</small></span><button class="chip" data-lk="rs:${x.k}">استرجاع</button></div>`).join(""):'<div class="empty">لسه مفيش نسخ.</div>'}
  <div class="note" style="color:var(--soft);line-height:1.8;margin-top:14px">⚠️ القفل بيمنع اللي ماسك موبايلك من فتح التطبيق، لكنه مش تشفير للملفات. وعشان بياناتك تبقى آمنة لو الموبايل ضاع، احتفظ بملف احتياطي برّه الموبايل، وفعّل النسخ الاحتياطي التلقائي لحساب جوجل من إعدادات الموبايل (نسخ جوجل الاحتياطي). لو نسيت الرقم الطريقة الوحيدة مسح البيانات.</div></div>`;

try{if(lkGet())lkShow()}catch(e){}

<script>
/* ===== Quran khatma plan + Ramadan mode ===== */
const khS=()=>{const k=S.kh=(S.kh&&typeof S.kh==="object")?S.kh:{};k.total=k.total||604;k.log=(k.log&&typeof k.log==="object")?k.log:{};k.done=k.done||0;return k};
const khRead=k=>Object.values(k.log).reduce((a,b)=>a+(+b||0),0);
function khPlan(){
  const k=khS();if(!k.start)return null;
  const t=today0(),el=Math.max(0,Math.floor((t-dOf(k.start))/864e5)),read=khRead(k),rt=+k.log[iso(t)]||0;
  const rem=Math.max(0,k.total-(read-rt)),left=Math.max(1,k.days-el),target=Math.min(k.total,Math.ceil(rem/left));
  return{k,el,read,rt,target,left,pct:Math.min(100,Math.round(read/k.total*100)),done:read>=k.total,late:el>=k.days&&read<k.total};
}
function khAdd(n){
  const p=khPlan();if(!p)return;const k=p.k,tk=iso(today0());
  k.log[tk]=Math.max(0,(+k.log[tk]||0)+n);
  const q=khPlan();
  const h=S.habits.find(z=>/ورد|قرآن/.test(z.name)&&!z.goal);
  if(h){const key=tk+"|"+h.id;if(q.rt>=q.target&&q.rt>0)S.done[key]=1}
  if(q.done&&!k.fin){k.fin=1;k.done=(k.done||0)+1;toast("🎉 ما شاء الله، ختمت القرآن!")}
  Object.keys(k.log).sort().slice(0,-400).forEach(x=>delete k.log[x]);
  save();render();try{buzz(10)}catch(e){}
}
function khToday(){if(!uxOn("khatma"))return "";
  const p=khPlan();if(!p||p.done)return "";
  return `<div class="tcard" style="display:block;margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px"><span class="tx" style="flex:1" data-pg="khatma">📖 ختمتي<small>النهارده ${AR(p.rt)} / ${AR(p.target)} صفحة • تمّت ${AR(p.pct)}%</small></span><button class="chip" data-kh="add:1" style="background:var(--panel);color:var(--ink)">+١</button><button class="chip on" data-kh="add:5" style="background:var(--panel);color:var(--ink);font-weight:800">+٥</button></div><div style="height:5px;border-radius:99px;background:#0003;margin-top:8px;overflow:hidden"><div style="height:100%;width:${Math.min(100,Math.round(p.rt/p.target*100))}%;background:var(--acc)"></div></div></div>`;
}
function renderKhatma(){
  $("quote").textContent="ورد قليل دائم خير من كثير منقطع";
  const p=khPlan(),k=khS();
  if(!p){
    $("main").innerHTML=`<div class="deen" style="padding-bottom:110px"><h2 style="margin:6px 2px">📖 ختمة القرآن</h2><div class="note" style="color:var(--soft);line-height:1.8">اختار هتختم في كام يوم، والتطبيق يقولك تقرأ كام صفحة كل يوم ويعدّل الخطة لو فاتك يوم.${k.done?`<br>ختمات سابقة: ${AR(k.done)}`:""}</div>
    <div class="q">مدة الختمة</div><div class="chips">${[[30,"٣٠ يوم (رمضان)"],[60,"٦٠ يوم"],[90,"٩٠ يوم"],[120,"٤ شهور"],[180,"٦ شهور"],[365,"سنة"]].map(([d,t])=>`<button class="chip ${(W&&W.khd||30)===d?"on":""}" data-kh="d:${d}">${t}</button>`).join("")}</div>
    <div class="q">تذكير يومي (اختياري)</div><input class="inp" type="time" id="khr" value="21:00">
    <div class="note" style="color:var(--ink)">حوالي ${AR(Math.ceil(604/((W&&W.khd)||30)))} صفحة في اليوم</div>
    <button class="go" data-kh="start">ابدأ الختمة</button></div>`;
    return;
  }
  $("main").innerHTML=`<div class="deen" style="padding-bottom:110px"><h2 style="margin:6px 2px">📖 ختمة القرآن</h2>
  <div class="tcard on" style="display:block;text-align:center"><div style="font-size:13px;opacity:.85">${p.done?"ما شاء الله، خلّصت الختمة 🎉":"النهارده المطلوب"}</div><div style="font-size:40px;font-weight:800">${p.done?"✓":AR(p.rt)+" / "+AR(p.target)}</div><div style="font-size:12px">${p.done?"":"صفحة"}</div>
  <div style="height:8px;border-radius:99px;background:#0003;margin:10px 0 4px;overflow:hidden"><div style="height:100%;width:${p.pct}%;background:var(--panel)"></div></div><div style="font-size:12px">قرأت ${AR(p.read)} من ٦٠٤ صفحة (${AR(p.pct)}%) • فاضل ${AR(Math.max(0,p.k.total-p.read))}${p.done?"":" • باقي "+AR(p.left)+" يوم"}</div>${p.late?'<div style="font-size:12px;margin-top:6px">⚠️ عدّى الميعاد اللي حددته، كمّل بهدوء.</div>':""}</div>
  ${p.done?`<button class="go" data-kh="again">ابدأ ختمة جديدة</button>`:`<div class="chips" style="margin-top:12px;justify-content:center">${[1,5,10,20].map(n=>`<button class="chip on" data-kh="add:${n}" style="font-size:16px;padding:10px 16px">+${AR(n)}</button>`).join("")}<button class="chip" data-kh="add:-1">−١</button></div>`}
  <div class="chips" style="margin-top:14px"><button class="chip" data-kh="reset">🗑 إلغاء الخطة</button></div>
  ${p.k.rm?`<div class="note" style="color:var(--soft)">🔔 تذكير يومي الساعة ${esc(p.k.rm)}</div>`:""}</div>`;
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-kh]");if(!t)return;e.stopPropagation();
  const[k,a]=t.dataset.kh.split(":");
  if(k==="d"){W={khd:+a};renderKhatma();return}
  if(k==="add"){khAdd(+a);return}
  if(k==="start"){
    const kh=khS(),r=$("khr")&&$("khr").value;
    kh.start=iso(today0());kh.days=(W&&W.khd)||30;kh.log={};kh.fin=0;kh.rm=r||"";W=null;
    if(r){try{await ensurePerm()}catch(x){}}
    save();render();try{schedNotif()}catch(x){}toast("بالتوفيق، ربنا يتقبل 🤍");return;
  }
  if(k==="again"){const kh=khS();kh.start=null;kh.fin=0;kh.log={};save();render();return}
  if(k==="reset"){if(confirm("تلغي خطة الختمة؟")){const kh=khS();kh.start=null;kh.log={};kh.fin=0;save();render();try{schedNotif()}catch(x){}}return}
},true);

/* ---- Ramadan ---- */
function hij(d){try{const p=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric"}).formatToParts(d),g=x=>+(p.find(z=>z.type===x)||{}).value;return{y:g("year"),m:g("month"),d:g("day")}}catch(e){return null}}
const rdS=()=>{const r=S.rmd=(S.rmd&&typeof S.rmd==="object")?S.rmd:{};r.fast=r.fast||{};r.tar=r.tar||{};return r};
function rdState(){
  const h=hij(today0());if(!h)return{ram:false,days:null};
  if(h.m===9)return{ram:true,day:h.d,days:0};
  let n=null;for(let i=1;i<=400;i++){const x=hij(addDays(today0(),i));if(x&&x.m===9){n=i;break}}
  return{ram:false,days:n};
}
function rdActive(){return rdState().ram||!!rdS().force}
function rdTimes(d){try{const L=LC(),T=PT(d,L.la,L.lo);return{f:T.f,m:T.m}}catch(e){return null}}
const rdAt=(d,h)=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(h),Math.round((h%1)*60),0);
function rdToday(){if(!uxOn("ramadan"))return "";
  if(!rdActive())return "";
  const s=rdState(),r=rdS(),tk=iso(today0()),T=rdTimes(today0());if(!T)return "";
  const now=new Date(),h=now.getHours()+now.getMinutes()/60;
  const nx=h<T.f?["السحور/الإمساك",T.f]:h<T.m?["الإفطار",T.m]:["إمساك بكرة",T.f+24],mins=Math.max(0,Math.round((nx[1]-h)*60));
  return `<div class="tcard on" style="display:block;margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px"><span class="tx" style="flex:1" data-pg="ramadan">🌙 رمضان${s.ram?" • يوم "+AR(s.day):""}<small>${nx[0]} بعد ${AR(Math.floor(mins/60))} س ${AR(mins%60)} د</small></span><button class="chip ${r.fast[tk]?"on":""}" data-rd="fast" style="background:var(--panel);color:var(--ink)">${r.fast[tk]?"✓ صايم":"صايم؟"}</button></div></div>`;
}
function renderRamadan(){

  const s=rdState(),r=rdS(),tk=iso(today0()),T=rdTimes(today0());

  const f=h=>h==null?"-":hm(h);
  if(!rdActive()){
    $("main").innerHTML=`<div class="deen"><h2 style="margin:6px 2px">🌙 رمضان</h2><div class="tcard on" style="display:block;text-align:center"><div style="font-size:13px">رمضان بعد حوالي</div><div style="font-size:44px;font-weight:800">${s.days==null?"—":AR(s.days)}</div><div style="font-size:12px">يوم</div></div><div class="note" style="color:var(--soft);line-height:1.8;margin-top:10px">لما رمضان يبدأ هيتفعّل الوضع تلقائي. تقدر تفعّله من دلوقتي للتجهيز.</div><button class="go" data-rd="force">🌙 فعّل وضع رمضان</button></div>`;return;
  }
  $("main").innerHTML=`<div class="deen" style="padding-bottom:110px"><h2 style="margin:6px 2px">🌙 رمضان ${s.ram?"• يوم "+AR(s.day):"(تجهيز)"}</h2>
  <div class="tcard on" style="display:block"><div style="display:flex;justify-content:space-around;text-align:center"><div><div style="font-size:12px;opacity:.85">الإمساك (الفجر)</div><div style="font-size:24px;font-weight:800">${f(T&&T.f)}</div></div><div><div style="font-size:12px;opacity:.85">الإفطار (المغرب)</div><div style="font-size:24px;font-weight:800">${f(T&&T.m)}</div></div></div></div>

<script>

}
let BDT=0;
function bdSoon(){clearTimeout(BDT);BDT=setTimeout(bdCheck,1500)}
function rvBanner(){if(!uxOn("review"))return "";
  const dow=(today0().getDay()+1)%7;if(dow>2)return "";
  const k=iso(wkStart(0));if(S.rvSeen===k)return "";
  const st=rvStats(wkStart(-1));if(st.pct==null)return "";
  return `<button class="tcard" data-pg="review" style="margin-bottom:10px;border-color:var(--acc)"><span class="tx">📊 مراجعة أسبوعك جاهزة<small>التزامك الأسبوع اللي فات ${AR(st.pct)}%</small></span><b>›</b></button>`;
}
const RV={tab:"review",wk:-1};
function renderReview(){
  $("quote").textContent="اللي بيراجع نفسه بيتحسّن";
  S.rvSeen=iso(wkStart(0));
  const ch=(on,k,t)=>`<button class="chip ${on?"on":""}" data-rv="${k}">${t}</button>`;
  let body="";
  if(RV.tab==="review"){
    const s=wkStart(RV.wk),st=rvStats(s),L=rvLines(st);
    body=`<div class="chips" style="margin:6px 0">${ch(RV.wk===-1,"wk:-1","الأسبوع اللي فات")}${ch(RV.wk===0,"wk:0","الأسبوع ده لحد دلوقتي")}</div><div class="note" style="color:var(--soft)">${fmt(s)} – ${fmt(addDays(s,6))}</div>
    <div class="tcard on" style="display:block;text-align:center"><div style="font-size:13px;opacity:.85">التزامك</div><div style="font-size:48px;font-weight:800">${st.pct==null?"—":AR(st.pct)+"%"}</div></div>
    ${L.map(x=>`<div class="tcard" style="display:block;padding:10px 14px">${x}</div>`).join("")}
    ${st.best?`<div class="note" style="color:var(--ink)">⭐ الأقوى: ${esc(st.best.h.name)} (${AR(Math.round(st.best.p*100))}%)</div>`:""}${st.weak?`<div class="note" style="color:var(--ink)">📉 الأضعف: ${esc(st.weak.h.name)} (${AR(Math.round(st.weak.p*100))}%)</div>`:""}
    <div class="tcard" style="display:block;margin-top:10px;border-color:var(--acc)"><b>💡 نصيحة</b><div style="font-size:14px;line-height:1.8;margin-top:4px">${esc(rvTip(st))}</div></div>
    <div class="chips" style="margin-top:12px"><button class="chip on" data-rv="share" style="font-size:15px;padding:10px 18px">📤 شارك ملخّصك</button><button class="chip ${S.rvRem===0?"":"on"}" data-rv="rem">🔔 تذكير السبت</button></div>`;
  }else{
    const xp=bdXP(),lv=bdLevel(xp),lo=(lv-1)*(lv-1)*15,hi=lv*lv*15,un=BD.filter(b=>S.bd&&S.bd[b[0]]).length;
    body=`<div class="tcard on" style="display:block"><div style="font-size:13px;opacity:.85">مستواك</div><div style="font-size:40px;font-weight:800">${AR(lv)}</div><div style="height:8px;border-radius:99px;background:#0003;margin:8px 0 4px;overflow:hidden"><div style="height:100%;width:${Math.round((xp-lo)/(hi-lo)*100)}%;background:var(--panel)"></div></div><div style="font-size:12px">${AR(xp)} نقطة • الجاي عند ${AR(hi)} • شارات: ${AR(un)} من ${AR(BD.length)}</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">${BD.map(([id,e,n,d,f])=>{const ok=S.bd&&S.bd[id],[c,t]=f();return `<div class="tcard" style="display:block;text-align:center;${ok?"":"opacity:.5"}"><div style="font-size:30px">${ok?e:"🔒"}</div><b style="font-size:13px">${n}</b><div style="font-size:11px;opacity:.8">${d}</div>${ok?"":`<div style="font-size:11px;margin-top:2px">${AR(Math.min(c,t))} / ${AR(t)}</div>`}</div>`}).join("")}</div>`;
  }
  $("main").innerHTML=`<div class="deen" style="padding-bottom:110px"><h2 style="margin:6px 2px">📊 مراجعتي</h2><div class="chips">${ch(RV.tab==="review","tab:review","📊 المراجعة")}${ch(RV.tab==="badges","tab:badges","🏆 إنجازاتي")}</div>${body}</div>`;
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-rv]");if(!t)return;e.stopPropagation();
  const[k,a]=t.dataset.rv.split(":");
  if(k==="tab"){RV.tab=a;renderReview();return}
  if(k==="wk"){RV.wk=+a;renderReview();return}
  if(k==="rem"){S.rvRem=S.rvRem===0?1:0;if(S.rvRem!==0){try{await ensurePerm()}catch(x){}}save();renderReview();try{schedNotif()}catch(x){}return}
  if(k==="share"){
    const txt=rvText(RV.wk);
    try{const Sh=NPL("Share");if(Sh){await Sh.share({title:"مراجعة أسبوعي",text:txt});return}}catch(x){}
    try{await navigator.clipboard.writeText(txt);toast("اتنسخ الملخّص ✓")}catch(x){alert(txt)}
  }
},true);
setTimeout(bdCheck,2500);
try{render()}catch(e){}
</script>
<script>
/* ===== UX layer: quick add, customisation, setup checklist, collapsible sections, back button ===== */
function drawQK(){
  const it=[["habit","➕","عادة",""],["task","✅","مهمة","tasks"],["exp","💸","مصروف","money"],["med","💊","دواء","meds"],["day","📈","سجّل يومك","health"],["focus","⏱️","تركيز","focus"],["tpl","⚡","قوالب عادات",""],["quit","🌱","إقلاع","quit"]].filter(x=>!x[3]||uxOn(x[3]));
  $("sheet").innerHTML=`<h2>إضافة سريعة ⚡</h2><p>اختار اللي عايز تضيفه.</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">${it.map(x=>`<button class="cat" data-qk="${x[0]}" style="padding:14px 4px"><b style="font-size:26px;display:block">${x[1]}</b><span style="font-size:12px">${x[2]}</span></button>`).join("")}</div>`;
}
function uxQuick(){W={qk:1};drawW();$("modal").classList.add("on")}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-qk]");if(!t)return;e.stopPropagation();
  const k=t.dataset.qk;
  if(k==="habit")openW();else if(k==="task")openTK();else if(k==="exp")openMN("ex");else if(k==="med")openMD();
  else if(k==="day")openHL();else if(k==="tpl")openTPL();else if(k==="quit")openQT("add");
  else if(k==="focus"){closeW();page="focus";render()}
},true);

/* customisation page */
const UX_FS=[[0.92,"صغير"],[1,"عادي"],[1.12,"كبير"],[1.25,"كبير جدًا"]];
function uxApply(){const u=uxS();try{document.body.style.zoom=u.fs&&u.fs!==1?u.fs:""}catch(e){}document.documentElement.classList.toggle("compact",!!u.compact)}
function renderCustom(){
  $("quote").textContent="خلّي التطبيق على مزاجك";
  const u=uxS(),ch=(on,k,t)=>`<button class="chip ${on?"on":""}" data-cu="${k}">${t}</button>`;
  $("main").innerHTML=`<div class="deen" style="padding-bottom:110px"><h2 style="margin:6px 2px">🎛️ تخصيص</h2>
  <div class="note" style="color:var(--soft);line-height:1.8">اقفل المزايا اللي مش محتاجها عشان التطبيق يبقى أبسط. بتتشال من «المزيد» ومن الصفحة الرئيسية، وبياناتك مش بتتمسح.</div>
  <div class="sec">المزايا</div><div class="chips">${FEATS.filter(f=>f[0]!=="custom").map(f=>ch(!u.hide[f[0]],"t:"+f[0],f[2]+(u.hide[f[0]]?" ✕":""))).join("")}</div>
  <div class="sec">حجم الخط</div><div class="chips">${UX_FS.map(([v,t])=>ch((u.fs||1)===v,"fs:"+v,t)).join("")}</div>
  <div class="sec">الشكل</div><div class="chips">${ch(!!u.compact,"compact","📏 عرض مضغوط (كروت أصغر)")}</div>
  <div class="sec">مساعدة</div><div class="chips"><button class="chip" data-cu="chk">🧭 اعرض قايمة «ابدأ هنا» تاني</button></div></div>`;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-cu]");if(!t)return;e.stopPropagation();
  const[k,a]=t.dataset.cu.split(":"),u=uxS();
  if(k==="t"){u.hide[a]=u.hide[a]?0:1}
  else if(k==="fs"){u.fs=+a}
  else if(k==="compact"){u.compact=u.compact?0:1}
  else if(k==="chk"){u.chk=0;toast("هتلاقيها في الصفحة الرئيسية")}
  save();uxApply();renderCustom();
},true);

/* "start here" checklist for new users */
function uxChecklist(){
  const u=uxS();if(u.chk||!u.t0||Date.now()-u.t0>21*864e5)return "";
  const items=[
    ["ضيف ٣ عادات على الأقل","habit",S.habits.length>=3],
    ["فعّل تنبيهات الصلاة","pn",!!(S.pn&&S.pn.on)],
    ["ضيف أول مهمة","task",(S.tk||[]).length>0||((S.cn||{}).td||0)>0],
    ["استكشف «المزيد»","more",!!u.seenMore],
    ["فعّل القفل أو خد نسخة احتياطية","lock",!!lkGet()||snList().length>0]
  ],n=items.filter(x=>x[2]).length;
  if(n===items.length){u.chk=1;return ""}
  return `<div class="tcard" style="display:block;margin-bottom:10px;border-color:var(--acc)"><div style="display:flex;align-items:center"><b style="flex:1">🧭 ابدأ هنا (${AR(n)} من ${AR(items.length)})</b><i data-ux2="close" style="font-style:normal;padding:4px 8px;opacity:.7">✕</i></div><div style="height:5px;border-radius:99px;background:#0003;margin:8px 0;overflow:hidden"><div style="height:100%;width:${Math.round(n/items.length*100)}%;background:var(--acc)"></div></div>${items.map(x=>`<div data-ux2="${x[1]}" style="padding:6px 2px;font-size:14px;cursor:pointer;${x[2]?"opacity:.55;text-decoration:line-through":""}">${x[2]?"✅":"⬜"} ${x[0]}</div>`).join("")}</div>`;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-ux2]");if(!t)return;e.stopPropagation();
  const k=t.dataset.ux2,u=uxS();
  if(k==="close"){u.chk=1;save();render()}
  else if(k==="habit")openW();
  else if(k==="pn")$("thm").click();
  else if(k==="task")openTK();
  else if(k==="more"){u.seenMore=1;save();page="more";render()}
  else if(k==="lock"){page="lock";render()}
},true);

/* collapsible sections on Today (state is remembered) */
function uxCollapse(){
  const m=$("main"),col=uxS().col;let hide=false;
  [...m.children].forEach(el=>{
    if(el.classList&&el.classList.contains("sec")){
      const key=(el.dataset.ux||el.textContent.replace(/^[▾▸]\s*/,"").replace(/\s*[\(✓].*$/,"")).trim();
      el.dataset.ux=key;hide=!!col[key];
      el.textContent=(hide?"▸ ":"▾ ")+X(key);el.style.cursor="pointer";
    }else if(hide){el.style.display="none"}
  });
}
document.addEventListener("click",e=>{
  const t=e.target.closest("#main > .sec[data-ux]");if(!t||page!=="today")return;
  const u=uxS();u.col[t.dataset.ux]=u.col[t.dataset.ux]?0:1;save();render();
},true);

/* hardware back button */
let EXITT=0;
function uxBack(){
  if(document.getElementById("lockscr")){try{NPL("App").minimizeApp()}catch(e){}return true}
  const m=$("modal");if(m&&m.classList.contains("on")){closeW();return true}
  if(MORE.indexOf(page)>=0&&page!=="more"){page=(SUBFROM&&SUBFROM!==page)?SUBFROM:"more";render();return true}
  if(page!=="today"){page="today";render();return true}
  if(Date.now()-EXITT<2000){try{NPL("App").exitApp()}catch(e){}return false}
  EXITT=Date.now();toast("اضغط رجوع تاني للخروج");return true;
}
try{const A=NPL("App");if(A&&A.addListener)A.addListener("backButton",()=>{uxBack()})}catch(e){}
document.addEventListener("click",e=>{if(e.target.closest("#bar button")){try{buzz(6)}catch(x){}if(e.target.closest('#bar [data-pg="more"]')){const u=uxS();if(!u.seenMore){u.seenMore=1;save()}}}},true);
uxApply();
try{render()}catch(e){}
</script>
</body>
</html>
