name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p www assets
          mv index.html www/index.html
          if [ -f adhan.mp3 ]; then cp adhan.mp3 www/adhan.mp3; fi
          mv icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/
      - name: Fetch Quran text
        run: |
          curl -fsSL --retry 3 -o www/quran.json https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/quran.json
          python3 - <<'PY'
          import json
          d = json.load(open('www/quran.json', encoding='utf-8'))
          a = d if isinstance(d, list) else (d.get('chapters') or list(d.values()))
          n = sum(len(c['verses']) for c in a)
          assert len(a) == 114 and n == 6236, (len(a), n)
          print('Quran OK:', n, 'verses')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Launcher icons and notifications patch
        run: |
          python3 -c "import PIL" || python3 -m pip install --break-system-packages pillow
          python3 patch-android.py
      - name: Build APK (signed if keystore secrets exist, otherwise debug)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          mkdir -p out
          cd android
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "Signed release build"
            ./gradlew assembleRelease
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              --out ../out/jadwali.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify ../out/jadwali.apk
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "No keystore secrets found: building debug APK"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../out/jadwali.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: out/jadwali.apk
